; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
src_dir = examples

[env]
build_type = debug
platform = https://github.com/pioarduino/platform-espressif32.git#develop
board = esp32dev
framework = arduino
monitor_filters = esp32_exception_decoder
monitor_speed = 115200

[env:executor_active]
build_src_filter = -<*> +<executor/active>

[env:executor_light]
build_src_filter = -<*> +<executor/light>

[env:executor_deep]
build_src_filter = -<*> +<executor/deep>

[env:executor_mixed]
build_src_filter = -<*> +<executor/mixed>

[env:executor_tick]
build_src_filter = -<*> +<executor/tick>

[env:executor_demand]
build_src_filter = -<*> +<executor/demand>

[env:state_simple]
build_src_filter = -<*> +<state/simple>

[env:state_save]
build_src_filter = -<*> +<state/savestate>

[env:pin_simple]
build_src_filter = -<*> +<pin/simple>

[env:pin_deep]
build_src_filter = -<*> +<pin/deepsleep>